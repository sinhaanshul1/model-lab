services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: modellab_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modellab_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MODELLAB_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/modellab_dev
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    
    command:
      [
        "sh",
        "-c",
        "python -m modellab.storage.initialize && fastapi run src/modellab/api/main.py --host 0.0.0.0 --port 8000",
      ]
volumes:
  postgres_data: